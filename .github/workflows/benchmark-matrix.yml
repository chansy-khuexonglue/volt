name: Multi-machine Benchmarks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/matrix/**'
      - '.github/workflows/benchmark-matrix.yml'
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Benchmark eight frameworks
        run: bun benchmarks/matrix/run.ts
        env:
          BENCH_SECONDS: '2'
          BENCH_REPEATS: '3'
          BENCH_CONCURRENCY: '10,100'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-results/
