name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'examples/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'examples/**'

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Framework Test Suite
        run: bun test packages/*/test packages/plugins/*/test benchmarks/test

  docs:
    name: Build Documentation Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build documentation image
        run: docker build --progress=plain --file Dockerfile.web --tag volt-docs:ci .
