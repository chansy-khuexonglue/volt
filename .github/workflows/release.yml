name: Release & Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Packages to NPM & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun test

      - name: Setup Node for NPM Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Packages to NPM
        env:
          TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No NPM secret found! Ensure NPM_TOKEN or NODE_AUTH_TOKEN is configured in GitHub Repository Secrets."
            exit 1
          fi

          # Configure npm credentials
          echo "//registry.npmjs.org/:_authToken=${TOKEN}" > ~/.npmrc

          echo "🚀 Publishing workspace packages to NPM..."
          
          # Attempt Bun native recursive publisher first
          bun publish --recursive --access public || true

          # Explicit package publish fallback for npm compatibility
          for pkg in packages/core packages/router packages/validator packages/di packages/serializer packages/middleware packages/websocket packages/openapi packages/testing packages/cli packages/jwt packages/cache packages/jobs packages/node packages/volt packages/plugins/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg..."
              npm publish "$pkg" --access public || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
