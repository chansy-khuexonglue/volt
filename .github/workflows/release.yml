name: Release & Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Packages to NPM & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Framework Test Suite
        run: bun test packages/*/test packages/plugins/*/test benchmarks/test

      - name: Setup Node for NPM Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Packages to NPM
        timeout-minutes: 15
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
          TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No NPM secret found! Ensure NPM_TOKEN or NODE_AUTH_TOKEN is configured in GitHub Repository Secrets."
            exit 1
          fi

          # Configure npm credentials in both ~/.npmrc and local .npmrc
          echo "//registry.npmjs.org/:_authToken=${TOKEN}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${TOKEN}" > .npmrc

          echo "🔑 Verifying NPM authenticated user..."
          npm whoami --registry=https://registry.npmjs.org || echo "Could not determine whoami, proceeding with token..."

          echo "🚀 Publishing workspace packages to NPM under @voltts/* and voltts..."
          
          # List of packages in dependency order
          PACKAGES=(
            "packages/serializer"
            "packages/router"
            "packages/validator"
            "packages/middleware"
            "packages/di"
            "packages/core"
            "packages/websocket"
            "packages/openapi"
            "packages/testing"
            "packages/cli"
            "packages/jwt"
            "packages/cache"
            "packages/jobs"
            "packages/node"
            packages/plugins/*
            "packages/volt"
          )

          for pkg in "${PACKAGES[@]}"; do
            if [ -f "$pkg/package.json" ]; then
              pkg_name=$(node -p "require('./$pkg/package.json').name")
              pkg_ver=$(node -p "require('./$pkg/package.json').version")
              echo "----------------------------------------------------"
              echo "📦 Publishing $pkg_name@$pkg_ver from $pkg..."

              # Skip versions that already exist on the registry
              if npm view "$pkg_name@$pkg_ver" version --registry https://registry.npmjs.org 2>/dev/null | grep -q "$pkg_ver"; then
                echo "ℹ️ $pkg_name@$pkg_ver already published, skipping."
                continue
              fi

              # Inspect the exact package contents before publishing. Never ship the
              # repository's examples or documentation website in an npm tarball.
              package_files=$(cd "$pkg" && npm pack --dry-run --json | node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  const files = JSON.parse(input)[0].files.map(file => file.path);
                  if (files.some(path => /(^|\\/)(examples|web)(\\/|$)/.test(path))) {
                    console.error("Unexpected examples/ or web/ content in npm package");
                    process.exit(1);
                  }
                  console.log(files.length + " package files checked");
                });
              ')
              echo "$package_files"

              # bun publish rewrites "workspace:*" deps to concrete versions (npm publish does not)
              # stdin from /dev/null + timeout: never hang waiting for an interactive OTP prompt
              if (cd "$pkg" && NPM_CONFIG_TOKEN="$TOKEN" CI=true timeout 120 bun publish --access public < /dev/null); then
                echo "✅ Successfully published $pkg_name@$pkg_ver"
              else
                echo "::error::❌ Failed to publish $pkg_name@$pkg_ver. If this timed out, your NPM token requires 2FA: create a Granular Access Token with 'Bypass two-factor authentication' enabled (or a Classic 'Automation' token) and save it as the NPM_TOKEN secret."
                exit 1
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
